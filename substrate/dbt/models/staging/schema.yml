version: 2

# Added for the fault-injection evaluation suite, and worth being explicit about
# why: without any tests, `dbt build` is identical to `dbt run`, and a whole
# class of faults — the ones that break DATA rather than SCHEMA — produces no
# failure signal at all. DevGuard would then have nothing to detect and would
# correctly refuse on every one of them, which would make the eval measure
# nothing.
#
# These are the tests a competent analytics engineer writes on this shape of
# model anyway: keys are unique and present, amounts and statuses are present.
# They are NOT tuned to the injected faults — `null_rate_spike` is caught by
# `not_null` because that is what `not_null` is for, and `silent_value_drift`
# is NOT caught by anything here, which is reported as a genuine miss rather
# than papered over with a bespoke range check written after seeing the fault.
#
# `dbt run` behaviour is unchanged by this file, so every earlier phase's
# recorded evidence remains reproducible.
#
# OWNERSHIP, TAGS AND TERMS ARE DECLARED HERE, NOT CLICKED INTO DATAHUB.
# `meta.owner` / `meta.business_owner` / `meta.has_pii` are read by DataHub's
# dbt source through the `meta_mapping` block in `recipes/dbt.yml`, and dbt
# `tags` arrive as DataHub tags. Declaring them in the transformation project
# means the catalog's governance state is reproducible from a clone — which is
# the same standard the lineage is held to. An owner set by hand in the UI
# would vanish on the next `datahub docker nuke` and could not be reviewed in a
# diff.
#
# The owners are the two local operator identities the quickstart creates, not
# invented people: `urn:li:corpuser:datahub` is the admin the quickstart seeds,
# and `urn:li:corpuser:devguard_agent` is the least-privilege service account
# `scripts/setup_service_account.py` creates. DevGuard's Magistrate resolves the
# approver from whatever the graph says here — never from its own config.

models:
  - name: stg_users
    description: Typed, filtered users from raw.users.
    # `meta` and `tags` live under `config` — dbt moved them there, and a
    # top-level `tags:` key is silently accepted and silently ignored, which
    # produced an empty `tags` array in the manifest and no DataHub tags at all.
    config:
      meta:
        owner: datahub
        has_pii: true
      tags:
        - devguard_hero_path
        - pii
    columns:
      - name: user_id
        description: Primary key, carried through to the ML feature table.
        tests: [unique, not_null]
      - name: email
        tests: [not_null]

  - name: stg_orders
    description: Typed orders from raw.orders.
    config:
      meta:
        owner: datahub
      tags:
        - devguard_hero_path
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: amount_cents
        description: Order value in minor units. Never null for a real order.
        tests: [not_null]
      - name: status
        tests: [not_null]
